name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          expected = f'v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f"Tag {os.environ['RELEASE_TAG']} does not match Cargo.toml ({expected})")
          PY
      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-alsa
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Test and build
        run: |
          cargo +stable fmt --check
          cargo +stable test --locked
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable build --locked --release
      - name: Archive executable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="pocket3-kvm-viewer-${RELEASE_TAG}-linux-x86_64.tar.gz"
          tar -czf "$archive" -C target/release pocket3-kvm-viewer
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="pocket3-kvm-viewer-${RELEASE_TAG}-linux-x86_64.tar.gz"
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
